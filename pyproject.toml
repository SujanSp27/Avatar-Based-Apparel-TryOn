[project]
name = "avatar-virtual-tryon"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
description = "Online GPU photo virtual try-on with independent brand sizing"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires downloaded pose model and sample images"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ml/vton/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

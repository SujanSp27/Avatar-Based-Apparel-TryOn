server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;
  client_body_timeout 30s;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location ~ ^/(api/|assets/[0-9a-f-]{36}/|static/annotated/) {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 650s;
    proxy_connect_timeout 5s;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
  }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
